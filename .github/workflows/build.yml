name: Build & Publish Caddy

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Check out Naive forwardproxy
        uses: actions/checkout@v4
        with:
          repository: klzgrad/forwardproxy
          ref: naive
          path: .forwardproxy

      - name: Read compatible Caddy version
        run: printf 'CADDY_VERSION=%s\n' "$(<.forwardproxy/CADDY_VERSION)" >> "$GITHUB_ENV"

      - name: Check out compatible Caddy
        uses: actions/checkout@v4
        with:
          repository: caddyserver/caddy
          ref: ${{ env.CADDY_VERSION }}
          path: .caddy

      - name: Apply upstream Caddy patches
        run: |
          git -C .caddy apply \
            "$GITHUB_WORKSPACE/.forwardproxy/caddy-sing-quic-bbrv1.patch" \
            "$GITHUB_WORKSPACE/.forwardproxy/caddy-read-idle-timeout.patch"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: true
          cache-dependency-path: |
            .caddy/go.sum
            .forwardproxy/go.sum

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y curl

      - name: Install xcaddy
        run: go install github.com/caddyserver/xcaddy/cmd/xcaddy@latest

      - name: Build Caddy binaries
        run: |
          for arch in amd64 arm64; do
            env CGO_ENABLED=0 GOOS=linux GOARCH=${arch} xcaddy build "$CADDY_VERSION" \
              --replace "github.com/caddyserver/caddy/v2=$GITHUB_WORKSPACE/.caddy" \
              --with github.com/caddy-dns/cloudflare \
              --with github.com/mholt/caddy-webdav \
              --with "github.com/caddyserver/forwardproxy=$GITHUB_WORKSPACE/.forwardproxy" \
              --output caddy_${arch}
          done
          ./caddy_amd64 version
          ./caddy_amd64 list-modules --skip-standard

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: caddy-builds
          path: caddy_*
          retention-days: 7

  docker:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: caddy-builds
          path: .

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push multi-arch Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}

  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: caddy-builds
          path: dist

      - name: Delete existing latest release (if any)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest --yes || true
          git push --delete origin latest || true

      - name: Create GitHub Release and upload binaries
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Caddy Custom Build (latest)
          body: |
            Automated Caddy build with:
            - cloudflare DNS
            - webdav
            - naive forwardproxy

            Built from commit: ${{ github.sha }}
          files: |
            dist/caddy_amd64
            dist/caddy_arm64
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
